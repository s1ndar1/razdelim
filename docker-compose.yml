services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-razdelim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-razdelim}
      POSTGRES_DB: ${POSTGRES_DB:-razdelim}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-razdelim} -d ${POSTGRES_DB:-razdelim}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEMO_MODE: ${DEMO_MODE:-false}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-razdelim}:${POSTGRES_PASSWORD:-razdelim}@db:5432/${POSTGRES_DB:-razdelim}
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_NAME: ${BOT_NAME:-razdelim_bot}
      MAX_API_BASE: ${MAX_API_BASE:-https://platform-api.max.ru}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
