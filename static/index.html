<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Разделим</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="phone-shell">
    <div id="app" class="loading">Загрузка…</div>
  </div>

  <script src="/static/max-sdk.js"></script>
  <script src="/static/max-parent-sdk.js"></script>
  <script>
    const API_BASE = window.location.origin;

    async function init() {
      const app = document.getElementById('app');
      const startParam = window.WebApp?.initDataUnsafe?.start_param;
      const initData = window.WebApp?.initData;

      if (!startParam || !initData) {
        app.innerHTML = '<div class="card"><span class="label">Сессия</span><h2>Ссылка не найдена</h2><p class="meta">Откройте мини-приложение по ссылке из чата, чтобы присоединиться к сбору.</p></div>';
        return;
      }

      try {
        const joinRes = await fetch(`${API_BASE}/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ init_data: initData, start_param: startParam }),
        });

        if (!joinRes.ok) {
          throw new Error('Сессия недоступна или устарела');
        }

        const data = await joinRes.json();
        renderCard(data);
      } catch (error) {
        app.innerHTML = `<div class="card"><span class="label">Ошибка</span><h2>Не удалось присоединиться</h2><p class="meta">${escapeHtml(error.message || 'Попробуйте открыть ссылку ещё раз.')}</p></div>`;
      }
    }

    function renderCard(data) {
      const app = document.getElementById('app');
      const paid = data.status === 'paid';
      const statusLabel = paid ? 'Оплачено' : 'Ожидает оплаты';

      app.innerHTML = `
        <div class="header">
          <div class="brand">Разделим</div>
          <div class="dot" aria-label="online"></div>
        </div>

        <div class="card">
          <span class="label">Сбор</span>
          <h2>${escapeHtml(data.session_title)}</h2>
          <div class="amount">${Number(data.share_amount).toFixed(0)} ₽</div>
          <p class="meta">Ваша доля участия</p>
          <span class="status-pill">${statusLabel}</span>
        </div>

        <div class="requisites">
          <strong>Реквизиты:</strong><br />${escapeHtml(data.requisites)}
        </div>

        <button id="confirm-btn" ${paid ? 'disabled' : ''}>${paid ? 'Оплачено' : 'Я оплатил'}</button>
      `;

      const btn = document.getElementById('confirm-btn');
      if (!paid && btn) {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          btn.textContent = 'Подтверждаем…';

          try {
            const r = await fetch(`${API_BASE}/confirm`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                init_data: window.WebApp?.initData,
                participant_id: data.participant_id,
              }),
            });

            if (!r.ok) {
              throw new Error('Не удалось подтвердить оплату');
            }

            btn.textContent = 'Оплачено';
            const pill = app.querySelector('.status-pill');
            if (pill) {
              pill.textContent = 'Оплачено';
              pill.style.background = '#eafaf2';
              pill.style.color = '#18a05d';
            }
          } catch (error) {
            btn.disabled = false;
            btn.textContent = 'Я оплатил';
            alert(error.message || 'Не удалось подтвердить оплату, попробуйте ещё раз');
          }
        });
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = String(str ?? '');
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
