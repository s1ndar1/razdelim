<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Разделим</title>
  <style>
    :root {
      --bg: #f3f7ff;
      --card: #ffffff;
      --primary: #2f6ae9;
      --primary-dark: #2257c7;
      --success: #18a05d;
      --success-soft: #eafaf2;
      --text: #1b2330;
      --muted: #667085;
      --border: #e6ebf2;
      --shadow: 0 18px 38px rgba(31, 56, 103, 0.12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #edf4ff 0%, #f7f9fc 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }
    .phone-shell {
      width: min(100%, 420px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 32px;
      box-shadow: var(--shadow);
      padding: 20px 18px 18px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }
    .brand {
      font-weight: 800;
      letter-spacing: 0.02em;
      font-size: 1.35rem;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 5px var(--success-soft);
    }
    .card {
      background: linear-gradient(180deg, #f9fbff 0%, #eef5ff 100%);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .label {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 1.55rem;
      line-height: 1.2;
    }
    .amount {
      font-size: 2rem;
      font-weight: 800;
      margin: 4px 0 14px;
    }
    .meta {
      color: var(--muted);
      margin: 0;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .status-pill {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--success-soft);
      color: var(--success);
      font-size: 0.8rem;
      font-weight: 700;
      margin-top: 10px;
    }
    .requisites {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.96rem;
      line-height: 1.5;
      margin: 16px 0 18px;
      word-break: break-word;
    }
    button {
      width: 100%;
      border: none;
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 14px;
      min-height: 52px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled {
      background: #9ab7ff;
      cursor: default;
      transform: none;
    }
    .loading {
      text-align: center;
      padding: 24px 10px;
      color: var(--muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <div id="app" class="loading">Загрузка…</div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    async function init() {
      const app = document.getElementById('app');
      const startParam = window.WebApp?.initDataUnsafe?.start_param;
      const initData = window.WebApp?.initData;

      if (!startParam || !initData) {
        app.innerHTML = '<div class="card"><span class="label">Сессия</span><h2>Ссылка не найдена</h2><p class="meta">Откройте мини-приложение по ссылке из чата, чтобы присоединиться к сбору.</p></div>';
        return;
      }

      try {
        const joinRes = await fetch(`${API_BASE}/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ init_data: initData, start_param: startParam }),
        });

        if (!joinRes.ok) {
          throw new Error('Сессия недоступна или устарела');
        }

        const data = await joinRes.json();
        renderCard(data);
      } catch (error) {
        app.innerHTML = `<div class="card"><span class="label">Ошибка</span><h2>Не удалось присоединиться</h2><p class="meta">${escapeHtml(error.message || 'Попробуйте открыть ссылку ещё раз.')}</p></div>`;
      }
    }

    function renderCard(data) {
      const app = document.getElementById('app');
      const paid = data.status === 'paid';
      const statusLabel = paid ? 'Оплачено' : 'Ожидает оплаты';

      app.innerHTML = `
        <div class="header">
          <div class="brand">Разделим</div>
          <div class="dot" aria-label="online"></div>
        </div>

        <div class="card">
          <span class="label">Сбор</span>
          <h2>${escapeHtml(data.session_title)}</h2>
          <div class="amount">${Number(data.share_amount).toFixed(0)} ₽</div>
          <p class="meta">Ваша доля участия</p>
          <span class="status-pill">${statusLabel}</span>
        </div>

        <div class="requisites">
          <strong>Реквизиты:</strong><br />${escapeHtml(data.requisites)}
        </div>

        <button id="confirm-btn" ${paid ? 'disabled' : ''}>${paid ? 'Оплачено' : 'Я оплатил'}</button>
      `;

      const btn = document.getElementById('confirm-btn');
      if (!paid && btn) {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          btn.textContent = 'Подтверждаем…';

          try {
            const r = await fetch(`${API_BASE}/confirm`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                init_data: window.WebApp?.initData,
                participant_id: data.participant_id,
              }),
            });

            if (!r.ok) {
              throw new Error('Не удалось подтвердить оплату');
            }

            btn.textContent = 'Оплачено';
            const pill = app.querySelector('.status-pill');
            if (pill) {
              pill.textContent = 'Оплачено';
              pill.style.background = '#eafaf2';
              pill.style.color = '#18a05d';
            }
          } catch (error) {
            btn.disabled = false;
            btn.textContent = 'Я оплатил';
            alert(error.message || 'Не удалось подтвердить оплату, попробуйте ещё раз');
          }
        });
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = String(str ?? '');
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
