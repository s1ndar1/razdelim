<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Создать сбор</title>
  <style>
    :root {
      --bg: #f5f7ff;
      --card: #ffffff;
      --primary: #2f6ae9;
      --primary-dark: #2557c7;
      --text: #18212f;
      --muted: #677487;
      --border: #e7ecf2;
      --success: #1ea96a;
      --success-soft: #edf9f2;
      --shadow: 0 18px 40px rgba(22, 34, 58, 0.12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
    }
    body {
      display: flex;
      justify-content: center;
      padding: 28px 16px;
    }
    .phone-shell {
      width: min(100%, 430px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 20px 18px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
    }
    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }
    form {
      display: grid;
      gap: 12px;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }
    textarea {
      min-height: 90px;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    button {
      margin-top: 6px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      min-height: 52px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    .result {
      margin-top: 18px;
      border: 1px solid #dfeafc;
      background: #f5f9ff;
      border-radius: 16px;
      padding: 14px;
      display: none;
    }
    .result.visible { display: block; }
    .result h3 {
      margin: 0 0 10px;
      font-size: 1.1rem;
    }
    .link {
      overflow-wrap: anywhere;
      color: var(--primary-dark);
      font-weight: 600;
    }
    .small {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <h1>Создать сбор</h1>
    <p class="subtitle">Сформируйте ссылку для участников, чтобы они открыли мини-приложение и подтвердили оплату.</p>

    <form id="session-form">
      <label>
        Название сбора
        <input name="title" type="text" value="Поход в кино" required />
      </label>

      <div class="row">
        <label>
          Сумма
          <input name="total_amount" type="number" value="1500" min="1" step="0.01" required />
        </label>
        <label>
          Людей
          <input name="head_count" type="number" value="4" min="1" required />
        </label>
      </div>

      <label>
        Реквизиты для оплаты
        <textarea name="requisites" required>+79990001122 · Сбербанк</textarea>
      </label>

      <button type="submit">Создать ссылку</button>
    </form>

    <div id="result" class="result" aria-live="polite">
      <h3>Готово</h3>
      <div id="link-box" class="link"></div>
      <div class="small">Откройте ссылку в браузере, чтобы проверить мини-приложение.</div>
    </div>
  </div>

  <script src="/static/max-sdk.js"></script>
  <script src="/static/max-parent-sdk.js"></script>
  <script>
    const form = document.getElementById('session-form');
    const resultBox = document.getElementById('result');
    const linkBox = document.getElementById('link-box');
    const API_BASE = window.location.origin;

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const formData = new FormData(form);
      const payload = {
        title: formData.get('title').trim(),
        total_amount: Number(formData.get('total_amount')),
        head_count: Number(formData.get('head_count')),
        requisites: formData.get('requisites').trim(),
      };

      const submitBtn = form.querySelector('button');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Создаём...';

      try {
        const response = await fetch(`${API_BASE}/sessions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.detail || 'Не удалось создать сбор');
        }

        const data = await response.json();
        linkBox.innerHTML = `<a href="${data.link}" target="_blank" rel="noreferrer">${data.link}</a>`;
        resultBox.classList.add('visible');
      } catch (error) {
        linkBox.textContent = error.message || 'Ошибка';
        resultBox.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Создать ссылку';
      }
    });
  </script>
</body>
</html>
