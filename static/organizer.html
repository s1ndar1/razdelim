<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Создать сбор</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      padding: 28px 16px;
    }
    .phone-shell {
      width: min(100%, 430px);
      padding: 20px 18px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
    }
    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }
    form {
      display: grid;
      gap: 12px;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }
    select {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }
    textarea {
      min-height: 90px;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    button {
      margin-top: 6px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      min-height: 52px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    .result {
      margin-top: 18px;
      border: 1px solid #dfeafc;
      background: #f5f9ff;
      border-radius: 16px;
      padding: 14px;
      display: none;
    }
    .result.visible { display: block; }
    .result h3 {
      margin: 0 0 10px;
      font-size: 1.1rem;
    }
    .link {
      overflow-wrap: anywhere;
      color: var(--primary-dark);
      font-weight: 600;
    }
    .small {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 8px;
    }
    @media (max-width: 420px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <h1>Создать сбор</h1>
    <p class="subtitle">Сформируйте ссылку для участников, чтобы они открыли мини-приложение и подтвердили оплату.</p>
    <p id="demo-notice" class="small" hidden>Локальный демо-режим: MAX не подключён, данные тестовые.</p>

    <form id="session-form">
      <label>
        Название сбора
        <input name="title" type="text" value="Поход в кино" required />
      </label>

      <div class="row">
        <label>
          Сумма
          <input name="total_amount" type="number" value="1500" min="1" step="0.01" required />
        </label>
        <label>
          Людей
          <input name="head_count" type="number" value="4" min="1" required />
        </label>
      </div>

      <label>
        Как участники вносят деньги
        <select name="payment_mode">
          <option value="equal">Поровну</option>
          <option value="flexible">Своя сумма, пока сбор не закрыт</option>
        </select>
      </label>

      <label>
        Реквизиты для оплаты
        <textarea name="requisites" required>+79990001122 · Сбербанк</textarea>
      </label>

      <button type="submit">Создать ссылку</button>
    </form>

    <div id="result" class="result" aria-live="polite">
      <h3>Готово</h3>
      <div id="link-box" class="link"></div>
      <div class="small">Откройте ссылку в браузере, чтобы проверить мини-приложение.</div>
    </div>
  </div>

  <script src="/static/max-sdk.js"></script>
  <script>
    const form = document.getElementById('session-form');
    const resultBox = document.getElementById('result');
    const linkBox = document.getElementById('link-box');
    const API_BASE = window.location.origin;
    const demoMode = new URLSearchParams(window.location.search).get('demo') === '1';
    document.getElementById('demo-notice').hidden = !demoMode;

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const formData = new FormData(form);
      const payload = {
        title: formData.get('title').trim(),
        total_amount: Number(formData.get('total_amount')),
        head_count: Number(formData.get('head_count')),
        payment_mode: formData.get('payment_mode'),
        requisites: formData.get('requisites').trim(),
        init_data: demoMode ? 'DEMO' : window.MaxSdk.getInitData(),
      };

      if (!payload.init_data) {
        linkBox.textContent = 'Откройте создание сбора через бота MAX.';
        resultBox.classList.add('visible');
        return;
      }

      const submitBtn = form.querySelector('button');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Создаём...';

      try {
        const response = await fetch(`${API_BASE}/sessions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.detail || 'Не удалось создать сбор');
        }

        const data = await response.json();
        const participantLink = document.createElement('a');
        participantLink.href = data.link;
        participantLink.target = '_blank';
        participantLink.rel = 'noreferrer';
        participantLink.textContent = data.link;
        const statusLink = document.createElement('a');
        statusLink.href = `/status?session_id=${encodeURIComponent(data.id)}${demoMode ? '&demo=1' : ''}`;
        statusLink.textContent = 'Открыть статус сбора';
        linkBox.replaceChildren(
          document.createTextNode('Ссылка участникам: '),
          participantLink,
          document.createElement('br'),
          statusLink,
        );
        resultBox.classList.add('visible');
      } catch (error) {
        linkBox.textContent = error.message || 'Ошибка';
        resultBox.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Создать ссылку';
      }
    });
  </script>
</body>
</html>
