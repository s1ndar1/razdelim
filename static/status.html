<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Статус сборов</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --primary: #2d6cdf;
      --primary-soft: #eaf1ff;
      --success: #1ea96a;
      --text: #18212f;
      --muted: #687385;
      --border: #e8ecf3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    .phone-shell {
      width: min(100%, 430px);
      background: var(--card);
      border-radius: 28px;
      box-shadow: 0 18px 40px rgba(22, 34, 58, 0.12);
      padding: 24px 20px 18px;
      border: 1px solid var(--border);
    }
    .title {
      margin: 0 0 14px;
      font-size: 1.5rem;
      font-weight: 700;
    }
    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    input, button {
      height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 1rem;
    }
    input {
      flex: 1;
      padding: 0 14px;
      background: #fff;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat {
      background: var(--primary-soft);
      border-radius: 14px;
      padding: 12px;
    }
    .stat-label {
      color: var(--muted);
      font-size: 0.72rem;
      display: block;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 1.2rem;
      font-weight: 700;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      text-align: left;
      padding: 10px 6px;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .status {
      display: inline-block;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      background: #edf7f2;
      color: var(--success);
    }
    .empty {
      color: var(--muted);
      padding: 18px 0;
      text-align: center;
    }
    @media (max-width: 420px) {
      .phone-shell { border-radius: 18px; }
      .form-row { flex-direction: column; }
      button, input { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <h1 class="title">Статус сборов</h1>
    <p class="subtitle">Проверка участников и оплаты по сессии</p>

    <div class="form-row">
      <input id="session-id" type="number" placeholder="ID сессии" value="1" />
      <button id="load-btn">Показать</button>
    </div>

    <div class="summary" id="summary"></div>
    <div id="table-wrap"></div>
  </div>

  <script src="/static/max-sdk.js"></script>
  <script src="/static/max-parent-sdk.js"></script>
  <script>
    const API_BASE = window.location.origin;
    const sessionInput = document.getElementById('session-id');
    const loadBtn = document.getElementById('load-btn');
    const summary = document.getElementById('summary');
    const tableWrap = document.getElementById('table-wrap');

    async function loadStatus() {
      const id = sessionInput.value.trim();
      if (!id) {
        tableWrap.innerHTML = '<div class="empty">Введите ID сессии.</div>';
        return;
      }

      loadBtn.disabled = true;
      loadBtn.textContent = 'Загрузка...';

      try {
        const response = await fetch(`${API_BASE}/sessions/${id}/status`);
        if (!response.ok) {
          throw new Error('Сессия не найдена');
        }
        const data = await response.json();
        renderStatus(data);
      } catch (error) {
        tableWrap.innerHTML = `<div class="empty">${error.message || 'Не удалось загрузить статус'}</div>`;
        summary.innerHTML = '';
      } finally {
        loadBtn.disabled = false;
        loadBtn.textContent = 'Показать';
      }
    }

    function renderStatus(data) {
      summary.innerHTML = `
        <div class="stat">
          <span class="stat-label">Всего собрано</span>
          <span class="stat-value">${Number(data.total_amount).toFixed(0)} ₽</span>
        </div>
        <div class="stat">
          <span class="stat-label">Присоединились</span>
          <span class="stat-value">${data.joined_count}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Оплатили</span>
          <span class="stat-value">${data.paid_count}</span>
        </div>
        <div class="stat">
          <span class="stat-label">План</span>
          <span class="stat-value">${data.head_count} чел.</span>
        </div>
      `;

      if (!data.participants || data.participants.length === 0) {
        tableWrap.innerHTML = '<div class="empty">Пока никто не присоединился к сбору.</div>';
        return;
      }

      tableWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Участник</th>
              <th>Доля</th>
              <th>Статус</th>
            </tr>
          </thead>
          <tbody>
            ${data.participants.map((p) => `
              <tr>
                <td>${p.first_name || 'Участник ' + p.user_id}</td>
                <td>${Number(p.share_amount).toFixed(0)} ₽</td>
                <td><span class="status">${p.status === 'paid' ? 'Оплатил' : 'Ожидает'}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    loadBtn.addEventListener('click', loadStatus);
    sessionInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') loadStatus();
    });

    loadStatus();
  </script>
</body>
</html>
